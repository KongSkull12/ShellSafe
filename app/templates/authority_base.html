<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShellSafe Authority Dashboard{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_dashboard.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body
    data-sensor-stream-url="{{ url_for('main.api_sensor_stream') if current_user.is_authenticated else '' }}"
    data-sensor-poll-url="{{ url_for('main.api_sensor_data') if current_user.is_authenticated else '' }}"
>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <img src="{{ url_for('static', filename='img/NAVLOGO.png') }}" alt="ShellSafe Logo" style="width: 150px; height: auto;">
            </div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'main.authority_dashboard' %}active{% endif %}" href="{{ url_for('main.authority_dashboard') }}">
                        <i class="bi bi-grid-fill"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'main.authority_alerts' %}active{% endif %}" href="{{ url_for('main.authority_alerts') }}">
                        <i class="bi bi-bell-fill"></i>
                        <span>Alerts</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <div class="user-card">
                    <div class="avatar"><i class="bi bi-person-circle"></i></div>
                    <div class="user-info">
                        <span class="user-name">Authority</span>
                        <span class="user-role">Coastal personnel</span>
                    </div>
                </div>
                <a href="{{ url_for('auth.logout') }}" class="logout-button">
                    <i class="bi bi-box-arrow-left"></i>
                    <span>Logout</span>
                </a>
            </div>
        </nav>
        <!-- Main Content -->
        <main class="main-content">
            <button
                class="btn btn-outline-primary d-md-none mb-3"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#authorityMobileSidebar"
                aria-controls="authorityMobileSidebar"
            >
                <i class="bi bi-list"></i> Menu
            </button>
            {% block content %}{% endblock %}
        </main>
    </div>

    <div class="offcanvas offcanvas-start d-md-none" tabindex="-1" id="authorityMobileSidebar" aria-labelledby="authorityMobileSidebarLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="authorityMobileSidebarLabel">ShellSafe</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body p-0">
            <ul class="nav flex-column p-3">
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'main.authority_dashboard' %}active{% endif %}" href="{{ url_for('main.authority_dashboard') }}">
                        <i class="bi bi-grid-fill"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'main.authority_alerts' %}active{% endif %}" href="{{ url_for('main.authority_alerts') }}">
                        <i class="bi bi-bell-fill"></i>
                        <span>Alerts</span>
                    </a>
                </li>
                <li class="nav-item mt-3">
                    <a class="nav-link text-danger" href="{{ url_for('auth.logout') }}">
                        <i class="bi bi-door-open-fill"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
    <div class="modal fade" id="ssConfirmModal" tabindex="-1" aria-labelledby="ssConfirmTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="ssConfirmTitle">Confirm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="ssConfirmBody">Are you sure?</div>
                <div class="modal-footer">
                    <button type="button" class="ss-btn-ghost" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="ss-btn-primary" id="ssConfirmBtn">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% if current_user.is_authenticated %}
    <script src="{{ url_for('static', filename='js/sensor-live.js') }}"></script>
    {% endif %}
    <script src="{{ url_for('static', filename='js/dash-ui.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
