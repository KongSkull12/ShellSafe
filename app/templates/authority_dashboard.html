{% extends "dashboard_base.html" %}

{% block content %}
{% set alerts_endpoint = 'main.authority_alerts' %}
{% include "_live_overview.html" %}
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/trend.js') }}?v=console1"></script>
<script>
    ShellSafeTrend.seed({{ history|tojson }}, 240);
    document.querySelectorAll('[data-chart]').forEach(function (panel) {
        ShellSafeTrend.mount(panel, { key: panel.dataset.chart, span: 60 });
    });
</script>
{% endblock %}
